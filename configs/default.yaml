app:
  name: qbr-platform
  env: dev

topology:
  min_nodes: 50
  max_nodes: 1000
  step_nodes: 50
  map_min_bound: 0
  map_max_bound: 100
  naming_pattern: "tp_{nodes}_{id:02d}"

run:
  batch_stop_policy: finish_current_topology
  save_full_artifacts_single: true
  save_full_artifacts_batch_default: false

compare:
  include_lower_bound: true
  include_greedy: false
